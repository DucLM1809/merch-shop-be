name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Dummy values — sufficient to boot the app; Stripe/Resend calls are mocked in tests.
  JWT_SECRET: test-jwt-secret-not-for-production-use-only
  STRIPE_SECRET_KEY: sk_test_dummy
  STRIPE_WEBHOOK_SECRET: whsec_dummy
  RESEND_API_KEY: re_dummy
  RESEND_FROM_EMAIL: orders@example.com
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: change-me-please-min-12-chars
  FRONTEND_URL: http://localhost:3001
  REFRESH_TOKEN_TTL_DAYS: 30
  PASSWORD_RESET_TOKEN_TTL_HOURS: 1
  EMAIL_VERIFICATION_TOKEN_TTL_HOURS: 24
  GUEST_CART_TTL_DAYS: 7
  NODE_ENV: test

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run prisma:generate
      - run: npm run build

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm test

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: merch_shop_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/merch_shop_test
